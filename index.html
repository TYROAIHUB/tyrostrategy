    <!-- Content Security Policy

         T-Atlas haritası (maplibre-gl) için iki ekleme yapıldı:

         1) worker-src 'self' blob:
            maplibre worker'ını kendi bundle'ından blob URL olarak oluşturuyor
            (new Worker(URL.createObjectURL(...))). CSP'de 'self' blob: şemasını
            KAPSAMAZ; izin verilmezse worker bloklanır ve harita çizilmez.

         2) CARTO basemap host'ları:
              basemaps.cartocdn.com          → style.json
              tiles.basemaps.cartocdn.com    → tiles.json, glyph, sprite
              tiles-a|b|c|d.basemaps.cartocdn.com → asıl vector tile (.mvt)

            DİKKAT: tile'lar subdomain'e bölünmüş (tiles-a … tiles-d). Sadece
            `tiles.basemaps.cartocdn.com` açıldığında style.json geliyor ama
            .mvt istekleri CSP'ye takılıp harita boş kalıyordu. Şablonlar
            style.json'da değil, onun işaret ettiği tiles.json'ın içinde —
            bu yüzden `*.basemaps.cartocdn.com` joker'i gerekiyor. Joker
            yalnızca bu alan adının alt alanlarını kapsıyor, cartocdn.com'un
            tamamını değil.

            CARTO erişilemezse harita gömülü Natural Earth altlığına düşüyor
            (config/basemapStyle.ts), yani kurumsal proxy ardında da çalışır.

         Not: kardeş uygulamalarda (tyrotrader) CSP meta etiketi hiç yok;
         burada sıkı politikayı koruyup yalnızca gereken host'ları açtık. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://basemaps.cartocdn.com https://*.basemaps.cartocdn.com; connect-src 'self' https://login.microsoftonline.com https://*.microsoft.com https://*.supabase.co https://basemaps.cartocdn.com https://*.basemaps.cartocdn.com; worker-src 'self' blob:; frame-src 'none';" />
